; IMPORTANT: DO NOT USE "BURN BOOTLOADER"
[platformio]
src_dir = firmware/src
lib_dir = firmware/lib

[env]
lib_deps =
    adafruit/Adafruit NeoPixel@=1.12.3
    chris--a/Keypad@=3.1.1

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 9600

[env:bare]
platform 			= atmelavr
board 				= ATmega328
framework 			= arduino
board_build.mcu 	= atmega328p
board_build.f_cpu 	= 8000000L
monitor_speed       = 9600
build_flags =
    -DSINGLE_BOARD="1"
    ;-DOSC_CAL=0x79    ; comment this line to disable OSCCAL override

; Settings for ICSP uploading
upload_protocol = custom
upload_flags = 
    -c 
    usbasp 
    -p 
    m328p 
    -F 
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:a

; Recommended Fuses for bare Atmega328P (8MHz)
board_fuses.lfuse   = 0xE2
board_fuses.hfuse   = 0xDA
board_fuses.efuse   = 0xFD

; USB upload through the on-board CH340C (DTR auto-reset), like a Nano.
; Needs MiniCore's urboot from env:bare_usb_bootloader first.
[env:bare_usb]
platform 			= atmelavr
board 				= ATmega328
framework 			= arduino
board_build.mcu 	= atmega328p
board_build.f_cpu 	= 8000000L
board_hardware.oscillator = internal
board_hardware.uart = uart0
; urboot autobauds, so RC drift doesn't matter, but 115200 is -3.5 % off
; at 8 MHz by itself; 38400 is 0.2 %
board_upload.speed  = 38400
monitor_speed       = 9600
build_flags = ${env:bare.build_flags}
upload_protocol = urclock

; Once per board, with the USBasp on J2:
;   pio run -e bare_usb_bootloader -t bootloader
; Writes urboot (autobaud, 1 s watchdog) and fuses E2/D7/FD (internal 8 MHz).
[env:bare_usb_bootloader]
extends = env:bare_usb
upload_protocol = usbasp
upload_flags = -F

[env:bare_calibration]
build_flags =
    ${env:bare.build_flags}
    -DOSC_CAL_SWEEP

extends = env:bare

; OSCCAL sweep uploaded over USB; then osccal_reader.py --write stores the
; result in EEPROM and env:bare_usb is uploaded as is.
[env:bare_usb_calibration]
extends = env:bare_usb
build_flags =
    ${env:bare_usb.build_flags}
    -DOSC_CAL_SWEEP